version: '3.8'

services:
  whisky:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: whisky-app
    network_mode: "bridge"
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - whisky_data:/app/data
      - whisky_assets:/app/assets
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  whisky_data:
  whisky_assets: